<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agbada & Grand Looks | Funshur Home of Fashion</title>

<style>
:root{
  --ink:#111;
  --cream:#f5f0e8;
  --gold:#c7a45b;
  --white:#fff;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:var(--cream);
  line-height:1.6;
}

a{
  text-decoration:none;
  color:inherit;
}

/* HEADER */

.collection-header{
  background:#111;
  color:#fff;
  padding:25px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.logo{
  font-family:Georgia,serif;
  font-size:1.15rem;
  letter-spacing:1.5px;
}

.logo span{
  color:var(--gold);
}

.back{
  color:#fff;
  border:1px solid #555;
  padding:10px 18px;
  font-size:.85rem;
}

.back:hover{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
}

/* TITLE */

.collection-intro{
  text-align:center;
  padding:90px 7% 55px;
}

.kicker{
  color:#987638;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:.78rem;
  margin-bottom:12px;
}

h1{
  font-family:Georgia,serif;
  font-size:clamp(2.5rem,6vw,5rem);
  line-height:1;
  margin-bottom:18px;
}

.collection-intro p{
  max-width:650px;
  margin:auto;
  color:#666;
}

/* GALLERY */

.gallery{
  padding:0 7% 90px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.gallery img{
  width:100%;
  height:430px;
  object-fit:cover;
  display:block;
  background:#ddd;
}

/* BOOKING */

    .collection-cta{
      text-align:center;
      padding:70px 7%;
      background:#181818;
    }

    .collection-cta h2{
      font-size:34px;
      margin-bottom:15px;
    }

    .collection-cta p{
      color:#ccc;
      margin-bottom:25px;
    }

    .btn{
      display:inline-block;
      padding:14px 24px;
      background:#fff;
      color:#111;
      text-decoration:none;
      font-weight:bold;
      border-radius:3px;
    }
.collection-footer{
  background:#000;
  color:#fff;
  text-align:center;
  padding:45px 7%;
}

.collection-footer p{
  color:#aaa;
  margin-bottom:20px;
}

.collection-footer a{
  display:inline-block;
  padding:12px 22px;
  background:#fff;
  color:#000;
  text-decoration:none;
  font-weight:bold;
  border-radius:3px;
}
    @media(max-width:800px){
      .gallery{
        grid-template-columns:repeat(2,1fr);
        width:92%;
      }

      .gallery img{
        height:330px;
      }
    }

    @media(max-width:520px){
      header{
        padding:20px 5%;
      }

      .hero{
        padding:60px 5% 35px;
      }

      .gallery{
        grid-template-columns:1fr;
        width:92%;
      }

      .gallery img{
        height:auto;
        aspect-ratio:4/5;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">FUNSHUR HOME OF FASHION</div>
  <a class="back" href="index.html#collection-kids">
  ← Back to Collections
</a>
</header>

<section class="hero">
  <div class="kicker">Our Collection</div>

  <h1>Kids</h1>

  <p class="intro">
    Smart, stylish and comfortable African outfits designed especially
    for little ones and special occasions.
  </p>
</section>

<section class="gallery">

  <img src="kids8.jpg" alt="Funshur Kids">
  <img src="kid1.jpg" alt="Funshur Kids">
  <img src="kids2.jpg" alt="Funshur Kids">
  <img src="kids3.jpg" alt="Funshur Kids">
  <img src="kids4.jpg" alt="Funshur Kids">
  <img src="kids5.jpg" alt="Funshur Kids">
  <img src="kids6.jpg" alt="Funshur Kids">
  

</section>

<footer class="collection-footer">

  <h2>Love this look?</h2>

  <p>
    Tell us what you're looking for and let's create the perfect outfit.
  </p>

  <a href="index.html#collection-kids">
    ← Back to Collections
  </a>

</footer>

</body>
</html>
